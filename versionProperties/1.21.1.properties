# Per-Minecraft-version build coordinates, loaded by settings.gradle into gradle.ext.*
# This file name (1.21.1) is matched against the mc_ver property in gradle.properties.

# Which loader modules to build (comma separated). Forge is intentionally omitted.
builds_for=fabric,neoforge

# Minecraft
minecraft_version=1.21.1
compatible_mc_versions=["1.21.1"]
java_version=21

# Loader versions
fabric_loader=0.17.3
fabric_api_version=0.116.7+1.21.1
# Unimined's neoForged { loader ... } prepends the MC-derived "21.1." prefix, so this is the
# NeoForge BUILD number only (full version = 21.1.233).
neoforge_loader=233
# Forge is not built, but common.gradle references this key unconditionally, so it must exist.
forge_loader=52.0.2
